version: '3'

secrets:
  opensearch_admin_password:
    file: ${OPENSEARCH_ADMIN_PASSWORD_FILE:?Set OPENSEARCH_ADMIN_PASSWORD_FILE}

services:
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: ronbrowser-opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD_FILE=/run/secrets/opensearch_admin_password
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    secrets:
      - opensearch_admin_password
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    networks:
      - ronbrowser-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: ronbrowser-opensearch-dashboards
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - OPENSEARCH_USERNAME=${OPENSEARCH_USERNAME:?Set OPENSEARCH_USERNAME}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:?Set OPENSEARCH_PASSWORD}
      - OPENSEARCH_SSL_VERIFICATIONMODE=${OPENSEARCH_SSL_VERIFICATIONMODE:-certificate}
    networks:
      - ronbrowser-net
    depends_on:
      - opensearch

volumes:
  opensearch-data:

networks:
  ronbrowser-net:
